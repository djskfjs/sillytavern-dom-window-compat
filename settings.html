<div id="dom_window_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>DOM Window 兼容测试版</b>
            <span id="dom_window_header_state" class="dom-window-header-state">已关闭</span>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="dom_window_autostart">
                <input type="checkbox" id="dom_window_autostart">
                <small>启用窗口（下次进入自动开启）</small>
            </label>
            <div class="dom-window-preload">
                <label for="dom_window_preload"><small>阅读窗口楼层</small></label>
                <input type="number" id="dom_window_preload" min="1" max="100" step="1" value="5" inputmode="numeric">
                <button type="button" id="dom_window_preload_save" class="menu_button">保存</button>
            </div>
            <small id="dom_window_compatibility" class="dom-window-compat-note" aria-live="polite"></small>
            <div id="dom_window_status" class="dom-window-status" data-enabled="false">
                <div class="dom-window-status-line">
                    <span id="dom_window_timer">运行 00:00:00</span>
                    <span id="dom_window_state">已关闭</span>
                </div>
                <div id="dom_window_metrics" class="dom-window-status-metrics">窗口 — · 已加载 0/0 层<br>DOM 0 · 堆内存 —</div>
            </div>
            <div class="dom-window-actions">
                <button type="button" id="dom_window_reload" class="menu_button" hidden>刷新页面</button>
                <button type="button" id="dom_window_restore" class="menu_button" hidden>恢复原助手设置</button>
                <button type="button" id="dom_window_diagnostics" class="menu_button">复制诊断信息</button>
            </div>
            <textarea id="dom_window_diagnostics_output" class="text_pole" aria-label="诊断信息，可全选复制" readonly hidden></textarea>
            <small class="dom-window-compat-note">0.4.3-compat.5 · 通用浏览器兼容。后台暂停恢复，异常保留页面；暂停后不再限制新增楼层，可在方便时手动刷新。诊断仅含浏览器版本、运行状态和数量，不含聊天内容、网址或密钥。</small>
            <small class="dom-window-compat-note">助手前端回收已适配 4.12.0；其他版本会显示原因并保留原聊天。减少楼层可以减轻负担，但无法保证阻止系统回收网页。</small>
        </div>
    </div>
</div>
